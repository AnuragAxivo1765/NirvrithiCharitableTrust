<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>News & Events | Nirvrithi Charitable Trust — Pookoya Thangal Hospice</title>
  <meta name="description" content="Latest news, events, announcements, and community updates from Nirvrithi Charitable Trust and Pookoya Thangal Hospice, Mannancherry, Alapuzha, Kerala." />
  <link rel="canonical" href="news.html" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="News & Events | Nirvrithi Charitable Trust" />
  <meta property="og:description" content="Community programmes, equipment drives, awareness events and announcements from Nirvrithi Charitable Trust." />
  <meta property="og:image"       content="assets/images/logo.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logo.png" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css?v=1.1" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────── -->
<div id="navbar-root"></div>

<main>

  <!-- Page Header -->
  <header class="page-header" aria-labelledby="news-page-heading">
    <div class="container">
      <p class="page-header__eyebrow">Updates · Nirvrithi Charitable Trust</p>
      <h1 class="page-header__title" id="news-page-heading">News &amp; Events</h1>
      <p class="page-header__desc">
        Stay informed about the work of Nirvrithi Charitable Trust and Pookoya Thangal Hospice —
        community programmes, awareness sessions, equipment donations, and more.
      </p>
    </div>
  </header>

  <!-- News Section -->
  <section class="section section--white" aria-label="News and events listing">
    <div class="container">

      <!-- Filter Bar -->
      <nav class="filter-bar" id="news-filter-bar" aria-label="Filter news by category">
        <!-- Filter buttons injected by JS -->
      </nav>

      <!-- Results count -->
      <p class="results-count" id="news-results-count" aria-live="polite" aria-atomic="true"></p>

      <!-- News Grid -->
      <div class="cards-grid cards-grid--3" id="news-all-grid" aria-live="polite" aria-label="News and event cards">
        <!-- News cards rendered by news.js -->
      </div>

    </div>
  </section>

</main>

<!-- ── Footer ──────────────────────────────────────────── -->
<div id="footer-root"></div>

<!-- Scripts -->
<script src="js/data/news.js"></script>
<script src="js/utils/animations.js"></script>
<script src="js/components/navbar.js?v=1.2"></script>
<script src="js/components/footer.js?v=1.1"></script>
<script src="js/components/news-card.js"></script>
<script src="js/pages/news.js"></script>

</html>
